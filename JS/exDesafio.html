<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            margin: 0%;
            padding: 0px;
            box-sizing: border-box;
        }



        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        form {
            background-color: rgb(254, 255, 255);
            width: 300px;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid rgb(128, 194, 142);
            box-shadow: 0px 0px 10px rgba(red, green, blue, alpha);
        }

        label {
            display: flex;
            margin-bottom: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 5px;
            border: none;
            box-shadow: 2px 1px 5px 0px;
            color: green;

        }



        button {
            width: 100%;
            padding: 10px;
            background-color: rgb(94, 202, 109);
            color: white;
            margin-top: 20px;
            border-radius: 10px;
            cursor: pointer;

        }
    </style>
</head>
