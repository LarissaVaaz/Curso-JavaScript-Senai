<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Alertas</h1>

    <script>

let nomeUsuario = window.prompt("Digite nome do aluno(a):")
        
        let numero1 = Number(window.prompt("Digite o nomero 1:"))
        let numero2 = Number(window.prompt("Digite o numero 2:"))
        let numero3 = Number(window.prompt("Digite o numero 3:"))

        let soma = numero1 + numero2 + numero3 / 3

window.alert(`A soma do aluno(a) ${nomeUsuario} resultou em: ${soma.toFixed(1)}`)


    </script>
</body>
</html>
